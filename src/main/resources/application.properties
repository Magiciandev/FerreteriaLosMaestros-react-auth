spring.application.name=ferreteria-auth
server.port=8082

# Base de datos MySQL (se pueden cambiar con variables de entorno).
spring.datasource.url=${AUTH_DB_URL:jdbc:mysql://localhost:3306/ferreteria_auth?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${AUTH_DB_USER:root}
spring.datasource.password=${AUTH_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT: el mismo secreto (Base64, mínimo 256 bits) debe estar en ferreteria-back para que valide los tokens.
# El valor por defecto es solo para desarrollo: en cualquier otro entorno se define JWT_SECRET.
app.jwt.secret=${JWT_SECRET:jWtOGcIBniNbHt7a1WKTfqFuGtq+klVT+zyyy7+apOqE+ijKt8oYS2xQ0azJnMRB}
app.jwt.issuer=ferreteria-auth
# Vence a la hora (3600000 ms).
app.jwt.expiration-ms=3600000
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
